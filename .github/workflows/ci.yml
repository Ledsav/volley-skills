name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes typecheck)
        run: npm run build

      - name: Unit + component tests
        run: npm test

      # Firestore Security Rules tests need a JVM for the emulator.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Security-rules tests
        run: npm run test:rules
