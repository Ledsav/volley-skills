name: Deploy

# Ships on every merge to main: builds the app and pushes hosting + Firestore
# rules + indexes to the live `volley-skills` project. The `verify` job repeats the
# ci.yml checks (lint, build, unit tests, security-rules tests) and `deploy` waits
# for it, so a direct push cannot ship a rules or code regression.

on:
  push:
    branches: [main]

# Least privilege: the jobs only read the repository. Deploy authenticates to
# Firebase with the service-account secret, not with the GitHub token.
permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (includes typecheck)
        run: npm run build

      - name: Unit + component tests
        run: npm test

      # Firestore Security Rules tests need a JVM for the emulator.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Security-rules tests
        run: npm run test:rules

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Write service-account credentials
        run: printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_VOLLEY_SKILLS }}' > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy hosting + rules + indexes
        run: npx firebase-tools deploy --only hosting,firestore:rules,firestore:indexes --project volley-skills --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
